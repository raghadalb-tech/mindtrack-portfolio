<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="MindTrack banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="45%" style="stop-color:#4c1d95"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#5eead4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="980" cy="80" r="120" fill="#7c3aed" opacity="0.18"/>
  <circle cx="1050" cy="220" r="90" fill="#14b8a6" opacity="0.22"/>
  <circle cx="150" cy="260" r="70" fill="#c4b5fd" opacity="0.12"/>
  <!-- App icon -->
  <g transform="translate(72,88)" filter="url(#glow)">
    <rect x="0" y="0" width="96" height="96" rx="22" fill="url(#accent)" opacity="0.95"/>
    <path d="M28 32h40v8H28zm0 18h28v8H28zm0 18h36v8H28z" fill="#1e1b4b" opacity="0.85"/>
    <circle cx="72" cy="72" r="14" fill="#1e1b4b" opacity="0.75"/>
    <path d="M66 72l4 4 8-10" stroke="#5eead4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="200" y="130" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="52" font-weight="700">MindTrack</text>
  <text x="200" y="175" fill="#c4b5fd" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="500">Smart Task Organizer · ADHD-Friendly · AI-Powered</text>
  <text x="200" y="220" fill="#99f6e4" font-family="Segoe UI, system-ui, sans-serif" font-size="16">Graduation Project · Full-Stack Portfolio</text>
  <rect x="200" y="248" width="180" height="36" rx="18" fill="#7c3aed" opacity="0.35"/>
  <text x="220" y="272" fill="#ede9fe" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600">FastAPI · PostgreSQL · Prompt Engineering</text>
</svg>
